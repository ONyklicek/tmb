name: Build JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: javac TeamsKeepAlive.java

      - name: Package runnable JAR
        run: jar --create --file TeamsKeepAlive.jar --main-class TeamsKeepAlive *.class

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamsKeepAlive
          path: TeamsKeepAlive.jar
