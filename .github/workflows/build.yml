name: Build JAR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile (target Java 8)
        run: javac --release 8 -Xlint:-options TeamsKeepAlive.java

      - name: Package runnable JAR
        run: jar --create --file TeamsKeepAlive.jar --main-class TeamsKeepAlive *.class

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamsKeepAlive
          path: TeamsKeepAlive.jar

      - name: Publish release with JAR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.0
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TeamsKeepAlive.jar --clobber
          else
            gh release create "$TAG" TeamsKeepAlive.jar \
              --title "$TAG" \
              --notes "Hotový TeamsKeepAlive.jar. Spuštění: java -jar TeamsKeepAlive.jar (potřebuje grafickou plochu)."
          fi
