name: Build JAR

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: javac TeamsKeepAlive.java

      - name: Package runnable JAR
        run: jar --create --file TeamsKeepAlive.jar --main-class TeamsKeepAlive *.class

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeamsKeepAlive
          path: TeamsKeepAlive.jar

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" TeamsKeepAlive.jar
          --title "${GITHUB_REF_NAME}"
          --notes "Hotový TeamsKeepAlive.jar. Spuštění: java -jar TeamsKeepAlive.jar (potřebuje grafickou plochu)."
